name: Unit Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt

      - name: Check PEP 8 style
        run: python -m pycodestyle app tests --max-line-length=99

      - name: Run tests with coverage
        run: |
          python -m coverage run --source=app -m pytest tests
          python -m coverage report -m
          python -m coverage report -m --format=markdown > coverage-report.md
          python -m coverage xml -o coverage.xml

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage-report
          path: |
            coverage-report.md
            coverage.xml

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const coverage = fs.readFileSync('coverage-report.md', 'utf8');
            const marker = '<!-- naarmlist-coverage-report -->';
            const body = [
              marker,
              '## Test Coverage',
              '',
              coverage.trim(),
              '',
              'Full coverage files are attached to the workflow run as the `test-coverage-report` artifact.'
            ].join('\n');

            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100
            });
            const existing = comments.data.find(comment => comment.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }
