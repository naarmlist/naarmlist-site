name: Pylint

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt

      - name: Run pylint syntax and error checks
        run: |
          python -m pylint app tests \
            --persistent=n \
            --disable=all \
            --enable=syntax-error,undefined-variable,undefined-loop-variable,used-before-assignment
